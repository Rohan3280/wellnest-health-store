<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3B30">
<title>Wellnest — Health & E-commerce Prototype</title>
<meta name="description" content="Interactive concept: health & wellness store with a mobile app, responsive website and admin dashboard sharing one backend.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--page:#E7EDE8;--bg:#F6F8F5;--surface:#FFFFFF;--surface-2:#EFF4F0;--surface-3:#DCE5DF;--text:#13241F;--muted:#677870;--line:#E2E9E4;--ink:#0F3B30;--brand:#1E8A6E;--brand-2:#DDF2EA;--accent:#EE6F4A;--accent-2:#FDE6DD;--gold:#EFAE30;--ok:#1E9E62;--ok-bg:#E0F4E9;--warn:#B97A12;--warn-bg:#FBF0D8;--bad:#D6453D;--bad-bg:#FBE3E1;--info:#3A6FD8;--info-bg:#E3ECFB;--shadow:0 8px 24px rgba(15,59,48,.08),0 1px 3px rgba(15,59,48,.05);--sat:50px;--sab:26px;--gh:62px;--fd:'Fraunces',Georgia,serif;--fb:'DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
html,body{height:100%}
body{font-family:var(--fb);background:var(--page);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
svg.i{flex:none;display:block}
small svg.i,p svg.i,.inl svg.i{display:inline-block;vertical-align:-2px}

/* ===== global bar ===== */
.gbar{position:sticky;top:0;z-index:60;height:var(--gh);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:0 20px;background:rgba(231,237,232,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.gbrand{display:flex;align-items:center;gap:9px;font:600 20px var(--fd)}
.gbrand em{font:800 10px var(--fb);font-style:normal;text-transform:uppercase;letter-spacing:.09em;background:var(--ink);color:#fff;padding:4px 7px;border-radius:6px}
.vt{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;box-shadow:var(--shadow)}
.vt button{height:38px;padding:0 16px;border-radius:10px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;color:var(--muted);white-space:nowrap}
.vt button.on{background:var(--ink);color:#fff}
.gsync{justify-self:end;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;gap:7px;align-items:center}
.gsync i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-bg)}

/* ===== app stage ===== */
#appStage{min-height:calc(100vh - var(--gh));display:flex;align-items:center;justify-content:center;gap:60px;padding:16px 24px;background:radial-gradient(800px 500px at 8% 10%,rgba(30,138,110,.16),transparent 60%),radial-gradient(700px 520px at 92% 92%,rgba(238,111,74,.10),transparent 60%)}
#webStage{display:none;flex-direction:column;align-items:center;padding:14px 20px 18px;height:calc(100vh - var(--gh));gap:12px}
body.web #appStage{display:none}
body.web #webStage{display:flex}
.pitch{width:360px;flex:none}
.pitch h1{font:600 36px/1.06 var(--fd);margin-bottom:12px;letter-spacing:-.01em}
.pitch p{color:var(--muted);font-size:15px;line-height:1.55;margin-bottom:18px;font-weight:500}
.feats{list-style:none;display:grid;gap:9px;margin-bottom:22px}
.feats li{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px}
.feats li span{width:28px;height:28px;border-radius:9px;background:var(--brand-2);color:var(--ink);display:grid;place-items:center;flex:none}
.jump-title{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:10px}
.jump{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.jump button{height:32px;padding:0 11px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:12.5px}
.jump button:hover{border-color:var(--ink)}
.jump button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hint-small{font-size:12.5px;color:var(--muted);line-height:1.5;font-weight:600}

/* phone */
.phone-wrap{width:calc(390px * var(--s,1));height:calc(844px * var(--s,1));flex:none;position:relative}
.phone{position:absolute;left:0;top:0;width:390px;height:844px;transform:scale(var(--s,1));transform-origin:0 0;border-radius:60px;background:#0D1714;padding:11px;box-shadow:0 0 0 2px #26332E,0 50px 90px -30px rgba(15,59,48,.45),0 20px 40px -20px rgba(15,59,48,.3)}
.phone-inner{position:relative;width:100%;height:100%;border-radius:49px;overflow:hidden;background:var(--bg);isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000;z-index:100}
.statusbar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:5px 28px 0 40px;font-weight:700;font-size:15px;z-index:99;pointer-events:none;color:var(--text)}
.statusbar.light{color:#fff}
.sb-icons{display:flex;gap:6px;align-items:center}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:var(--text);opacity:.85;z-index:100;pointer-events:none}

/* ===== web stage ===== */
.wtool{display:flex;gap:10px;align-items:center;width:100%;max-width:1280px;justify-content:space-between;flex-wrap:wrap;flex:none}
.wtool .grp{display:flex;gap:10px;align-items:center}
.wtool .lbl{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tseg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.tseg button{height:32px;padding:0 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.tseg button.on{background:var(--ink);color:#fff}
.bframe{flex:1;min-height:0;width:100%;max-width:1280px;background:var(--surface);border-radius:16px;box-shadow:0 30px 60px -30px rgba(15,59,48,.35),0 0 0 1px var(--line);display:flex;flex-direction:column;overflow:hidden;position:relative;transition:max-width .45s cubic-bezier(.2,.8,.2,1)}
.bframe[data-w="tablet"]{max-width:820px}
.bframe[data-w="mobile"]{max-width:400px}
.bchrome{height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#EDF2EE;border-bottom:1px solid var(--line);flex:none}
.bdots{display:flex;gap:6px}
.bdots i{width:11px;height:11px;border-radius:50%;background:#F0625B}.bdots i:nth-child(2){background:#F6BE3B}.bdots i:nth-child(3){background:#3DC556}
.bnav{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.bnav:hover{background:var(--surface-3)}
.burl{flex:1;max-width:560px;margin:0 auto;height:30px;border-radius:9px;background:var(--surface);display:flex;align-items:center;gap:7px;padding:0 12px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden}
.burl b{color:var(--text);font-weight:600}
.wsite{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;container-type:inline-size;container-name:site;background:var(--bg);position:relative}
.wsite.admin{overflow:hidden}
.wroot{min-height:100%}
.wsite.admin .wroot{height:100%}

/* ===== shared primitives ===== */
.btn{height:52px;border-radius:16px;font-weight:700;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;flex:none;text-align:center;transition:transform .1s,opacity .2s,background .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.38;pointer-events:none}
.btn-dark{background:var(--ink);color:#fff}
.btn-brand{background:var(--brand);color:#fff}
.btn-accent{background:var(--accent);color:#fff}
.btn-ghost{background:var(--surface-2);color:var(--text)}
.btn-line{background:var(--surface);border:1.5px solid var(--line)}
.btn-bad{background:var(--bad-bg);color:var(--bad)}
.btn.sm{height:40px;border-radius:12px;font-size:13.5px;width:auto;padding:0 14px}
.btn-link{font-weight:700;color:var(--muted);font-size:14px;padding:12px;width:100%;text-align:center}
.chip{height:36px;padding:0 13px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px 4px}
.chips::-webkit-scrollbar,.scroll::-webkit-scrollbar,.hs::-webkit-scrollbar,.msheet::-webkit-scrollbar,.dates::-webkit-scrollbar,.pdbody::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:8px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--info)}.p-mute{background:var(--surface-2);color:var(--muted)}.p-brand{background:var(--brand-2);color:var(--ink)}
.switch{width:46px;height:27px;border-radius:20px;background:var(--surface-3);position:relative;transition:background .25s;flex:none}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .25s}
.switch.on{background:var(--brand)}
.switch.on::after{left:22px}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;margin-bottom:14px;flex:none}
.seg button{flex:1;height:36px;border-radius:10px;font-weight:700;color:var(--muted);font-size:13.5px;text-align:center}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea,.inp{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 15px;font-size:15px;font-weight:600;outline:none}
.field textarea{height:84px;padding:12px 15px;resize:none}
.field input:focus,.inp:focus,.field textarea:focus{border-color:var(--brand)}
.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:800;flex:none}
.stars{display:inline-flex;gap:1px;color:var(--gold);vertical-align:-2px}
.rt{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--text)}
.rt svg{color:var(--gold)}
.rt small{color:var(--muted);font-weight:600}
.price{font-weight:800}
.mrp{color:var(--muted);text-decoration:line-through;font-weight:600;font-size:.86em}
.off{color:var(--brand);font-weight:800;font-size:.86em}
.stepper{display:inline-flex;align-items:center;border-radius:12px;background:var(--ink);color:#fff;height:36px;flex:none}
.stepper button{width:34px;height:36px;display:grid;place-items:center}
.stepper b{min-width:20px;text-align:center;font-size:14px}
.addb{height:36px;padding:0 14px;border-radius:12px;border:1.5px solid var(--brand);color:var(--brand);font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:5px;flex:none;background:var(--surface)}
.addb:disabled{border-color:var(--line);color:var(--muted)}
.empty{text-align:center;padding:40px 10px;color:var(--muted);font-weight:600}
.empty .ei{width:64px;height:64px;border-radius:20px;margin:0 auto 12px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.sumline{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;color:var(--muted);padding:5px 0}
.sumline b{color:var(--text);text-align:right}
.sumline.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:16px;color:var(--text);font-weight:800}
.sumline.disc b{color:var(--ok)}
.tl{position:relative;padding-left:4px}
.tl .st{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tl .st:last-child{padding-bottom:0}
.tl .st::before{content:'';position:absolute;left:11px;top:24px;bottom:-2px;width:2px;background:var(--surface-3)}
.tl .st.done::before{background:var(--brand)}
.tl .st:last-child::before{display:none}
.tl .dot{width:24px;height:24px;border-radius:50%;background:var(--surface-3);color:#fff;display:grid;place-items:center;flex:none;position:relative;z-index:1}
.tl .st.done .dot{background:var(--brand)}
.tl .st.cur .dot{box-shadow:0 0 0 5px var(--brand-2)}
.tl b{display:block;font-size:14px}
.tl small{font-size:12.5px;color:var(--muted);font-weight:600}
.tl .st:not(.done) b{color:var(--muted)}
@keyframes inF{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
@keyframes inB{from{transform:translateX(-26px);opacity:0}to{transform:none;opacity:1}}
@keyframes inFade{from{opacity:0}to{opacity:1}}
@keyframes inUp{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.06)}100%{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .8s linear infinite;display:inline-block}
.spinner.dk{border-color:var(--surface-3);border-top-color:var(--brand);width:44px;height:44px;border-width:4px}

/* ===== APP ===== */
#app{position:absolute;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.in-fwd{animation:inF .34s cubic-bezier(.2,.8,.2,1)}.in-back{animation:inB .34s cubic-bezier(.2,.8,.2,1)}.in-fade{animation:inFade .3s ease}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line);flex:none;position:relative}
.ib.glass{background:rgba(255,255,255,.92);border:0;box-shadow:var(--shadow)}
.ib .bd{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.ib .nb{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:0 20px 24px}
.topbar{display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 8px) 16px 12px;flex:none}
.topbar h2{flex:1;font-size:17px;font-weight:800}
.tb{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(var(--sat) + 12px) 20px 12px;flex:none}
.tb h1{font:600 28px var(--fd)}
.sec{display:flex;align-items:baseline;justify-content:space-between;font:600 19px var(--fd);margin:22px 2px 12px}
.sec small{font:700 13px var(--fb);color:var(--brand);cursor:pointer}
.card{background:var(--surface);border-radius:20px;padding:16px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border:0}
.row .tx{flex:1;min-width:0}
.row b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.ic{width:40px;height:40px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--ink)}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:8px 6px calc(var(--sab) + 2px);flex:none}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.tabbar .ti{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
.tabbar .on{color:var(--text)}
.tabbar .on .ti{background:var(--ink);color:#fff}
/* login */
.login{flex:1;display:flex;flex-direction:column;background:var(--ink);color:#fff;min-height:0}
.lhero{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.lhero>svg{position:absolute;inset:0;width:100%;height:100%}
.lw{position:relative;text-align:center}
.lw b{display:block;font:600 44px var(--fd);margin-top:10px}
.lw span{font-weight:600;opacity:.75}
.lpanel{background:var(--bg);color:var(--text);border-radius:30px 30px 0 0;padding:22px 20px calc(var(--sab) + 12px)}
.lpanel h2{font:600 25px var(--fd);margin-bottom:4px}
.lpanel .lead{color:var(--muted);font-weight:600;font-size:14px;margin-bottom:16px;line-height:1.45}
.phin{display:flex;gap:8px;margin-bottom:12px}
.phin .cc{height:54px;padding:0 14px;border-radius:15px;background:var(--surface);border:1.5px solid var(--line);font-weight:800;display:flex;align-items:center;flex:none;font-size:15px}
.phin input{flex:1;min-width:0;height:54px;border-radius:15px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px;font-size:18px;font-weight:700;outline:none;letter-spacing:.03em}
.phin input:focus{border-color:var(--brand)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px;font-weight:600;margin:14px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.social3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.social3 .btn{height:46px;font-size:13.5px}
.legal{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.5;text-align:center;font-weight:500}
.otp{display:flex;gap:8px;margin-bottom:14px}
.otp input{width:100%;min-width:0;height:58px;border-radius:15px;border:2px solid var(--line);background:var(--surface);text-align:center;font-size:24px;font-weight:800;outline:none}
.otp input:focus{border-color:var(--brand)}
.otp input.ok{border-color:var(--ok)}
.tip{display:flex;gap:9px;align-items:center;padding:11px 13px;border-radius:13px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--muted);margin-bottom:14px}
/* home */
.ahead{display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 10px) 20px 6px;flex:none}
.ahead .tx{flex:1;min-width:0}
.ahead small{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden}
.ahead b{display:block;font:600 21px var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar{display:flex;align-items:center;gap:10px;height:50px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);padding:0 14px;width:100%;color:var(--muted);font-weight:600;font-size:14.5px}
.sbar input{flex:1;border:0;outline:none;background:none;font-size:15px;font-weight:600;color:var(--text);min-width:0}
.sbar .ph{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.remcard{margin-top:14px;border-radius:22px;padding:16px;background:var(--ink);color:#fff;position:relative;overflow:hidden}
.remcard .rh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.remcard .rh small{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#9FD9C5}
.remcard .rh b{font:600 15px var(--fb)}
.remcard .rbar{height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;margin-bottom:12px}
.remcard .rbar i{display:block;height:100%;background:#7FE0B9;border-radius:3px;transition:width .4s}
.remcard .nx{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:15px;padding:10px 10px 10px 12px}
.remcard .nx .tx{flex:1;min-width:0}
.remcard .nx b{display:block;font-size:14.5px}
.remcard .nx small{font-size:12px;color:#B7D5CB;font-weight:600}
.remcard .nx .btn{height:38px;width:auto;padding:0 12px;font-size:13px;border-radius:11px;background:#7FE0B9;color:var(--ink)}

.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.wpc{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:10px 10px 14px;display:flex;flex-direction:column;text-align:left;position:relative;transition:box-shadow .15s,transform .15s}
.wpc:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.wpc .pa{border-radius:16px;overflow:hidden;line-height:0;aspect-ratio:1;position:relative;cursor:pointer}
.wpc .pa svg{width:100%;height:100%}
.wpc .dtag{position:absolute;top:10px;left:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px;line-height:1.3}
.wpc .tg{position:absolute;top:10px;right:10px;background:#fff;color:var(--ink);font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px;line-height:1.3}
.wpc .oos{position:absolute;inset:0;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--bad);line-height:1.3}
.wpc .br{font-size:11.5px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.06em;margin:12px 4px 2px}
.wpc .nm{font-size:15px;font-weight:700;line-height:1.3;margin:0 4px 6px;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:39px}
.wpc .rt{margin:0 4px 10px}
.wpc .pr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:auto 4px 0}
.wpc .pr .price{font-size:17px}
.wpc .pr .mrp{font-size:12.5px;margin-left:4px}
.cband{border-radius:28px;background:var(--ink);color:#fff;padding:34px;display:grid;grid-template-columns:1fr 1.2fr;gap:28px;align-items:center;margin-top:20px;position:relative;overflow:hidden}
.cband h2{font:600 32px/1.1 var(--fd);margin-bottom:10px}
.cband p{color:#B9D6CC;font-weight:500;line-height:1.55;margin-bottom:18px}
.cband .btn{width:auto;padding:0 22px;background:#7FE0B9;color:var(--ink);display:inline-flex}
.dmini{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.dmini div{background:rgba(255,255,255,.07);border-radius:18px;padding:14px;display:flex;gap:10px;align-items:center}
.dmini b{display:block;font-size:14px}
.dmini small{font-size:12px;color:#9FC6B9;font-weight:600}
.wart{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.wac{text-align:left;cursor:pointer}
.wac .aa{border-radius:20px;overflow:hidden;line-height:0;aspect-ratio:16/10}
.wac .aa svg{width:100%;height:100%}
.wac small{display:block;font-size:12px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.06em;margin:12px 2px 4px}
.wac b{display:block;font:600 19px/1.25 var(--fd);margin:0 2px 4px}
.wac p{font-size:13.5px;color:var(--muted);font-weight:500;line-height:1.5;margin:0 2px}
.wfoot{background:var(--ink);color:#B9D6CC;margin-top:48px;padding:40px 0 24px}
.wfoot .cols{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:24px}
.wfoot b{display:block;color:#fff;margin-bottom:10px;font-size:14px}
.wfoot a{display:block;font-size:13.5px;font-weight:500;margin-bottom:7px;cursor:pointer}
.wfoot .lg{display:flex;align-items:center;gap:9px;color:#fff;font:600 21px var(--fd);margin-bottom:10px}
.wfoot .bt{border-top:1px solid rgba(255,255,255,.1);margin-top:26px;padding-top:16px;font-size:12.5px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--muted);padding:20px 0 0;flex-wrap:wrap}
.crumbs button{color:var(--muted)}
.crumbs button:hover{color:var(--text)}
.wshop{display:grid;grid-template-columns:230px 1fr;gap:24px;padding:16px 0 10px}
.wside{display:flex;flex-direction:column;gap:18px}
.wside h4{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.wside .fl{display:flex;flex-direction:column;gap:2px}
.wside .fl button{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;font-weight:600;font-size:14px;text-align:left}
.wside .fl button:hover{background:var(--surface-2)}
.wside .fl button.on{background:var(--ink);color:#fff}
.wside .fl button small{font-size:12px;opacity:.7;font-weight:700}
.ck{display:flex;align-items:center;gap:10px;padding:7px 4px;font-weight:600;font-size:14px;cursor:pointer}
.ck i{width:20px;height:20px;border-radius:6px;border:2px solid var(--surface-3);display:grid;place-items:center;flex:none;color:transparent;font-style:normal}
.ck.on i{background:var(--brand);border-color:var(--brand);color:#fff}
.wtoolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.wtoolbar h1{font:600 30px var(--fd)}
.wtoolbar small{color:var(--muted);font-weight:600;font-size:13.5px}
.sel{height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px;font-weight:700;font-size:13.5px;outline:none}
.wpd{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:18px 0 10px;align-items:start}
.gal .main{border-radius:28px;overflow:hidden;line-height:0;aspect-ratio:1;border:1px solid var(--line)}
.gal .main svg{width:100%;height:100%}
.gal .th{display:flex;gap:10px;margin-top:10px}
.gal .th button{width:76px;height:76px;border-radius:16px;overflow:hidden;line-height:0;border:2px solid transparent}
.gal .th button.on{border-color:var(--brand)}
.gal .th svg{width:100%;height:100%}
.pinfo .brand{font-size:12.5px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.07em}
.pinfo h1{font:600 36px/1.08 var(--fd);margin:6px 0 10px}
.pinfo .pricebig .price{font-size:32px}
.offers{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.offers span{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:10px;border:1.5px dashed var(--brand);color:var(--ink);background:var(--brand-2)}
.buy{display:flex;gap:10px;align-items:center;margin:18px 0}
.buy .btn{flex:1;width:auto}
.buy .stepper{height:52px;border-radius:16px;background:var(--surface);color:var(--text);border:1.5px solid var(--line)}
.buy .stepper button{height:52px;width:42px}
.ptabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:30px 0 16px}
.ptabs button{padding:12px 0;font-weight:700;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.ptabs button.on{color:var(--text);border-color:var(--ink)}
.rbars{display:grid;gap:6px}
.rbars div{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700}
.rbars i{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:block}
.rbars i b{display:block;height:100%;background:var(--gold);border-radius:4px}
.wcart{display:grid;grid-template-columns:1fr 360px;gap:24px;padding:16px 0;align-items:start}
.wbox{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}
.wbox h3{font:600 20px var(--fd);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.wbox h3 .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font:800 13px var(--fb);display:grid;place-items:center}
.wci{display:grid;grid-template-columns:84px 1fr auto auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.wci:last-child{border:0}
.wci .pa{width:84px;height:84px;border-radius:16px;overflow:hidden;line-height:0;cursor:pointer}
.wci .pa svg{width:100%;height:100%}
.wci b{display:block;font-size:15px;cursor:pointer}
.wci small{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.wci .rm{font-size:12.5px;font-weight:700;color:var(--bad);margin-top:6px}
.sticky{position:sticky;top:90px}
.cpin{display:flex;gap:8px;margin-bottom:10px}
.cpin input{flex:1;min-width:0;height:44px;border-radius:12px;border:1.5px solid var(--line);padding:0 12px;font-weight:700;text-transform:uppercase;outline:none}
.adr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.payg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.payg button{padding:12px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;text-align:center}
.payg button.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand-2) 45%,var(--surface))}
.wsucc{text-align:center;max-width:620px;margin:0 auto;padding:44px 0 10px}
.wsucc .ok{width:84px;height:84px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;margin:0 auto 18px;animation:pop .6s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 0 12px var(--brand-2)}
.wsucc h1{font:600 36px var(--fd)}
.wsucc p{color:var(--muted);font-weight:600;margin:6px 0 20px;line-height:1.5}
.wacc{display:grid;grid-template-columns:240px 1fr;gap:24px;padding:20px 0;align-items:start}
.wacc .menu{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:10px}
.wacc .menu .me{display:flex;gap:10px;align-items:center;padding:8px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.wacc .menu .me b{display:block;font-size:15px}
.wacc .menu .me small{font-size:12px;color:var(--muted);font-weight:600}
.wacc .menu button.mi{display:flex;width:100%;align-items:center;gap:10px;padding:10px 10px;border-radius:12px;font-weight:700;font-size:14px}
.wacc .menu button.mi.on{background:var(--brand-2)}
.htl{display:flex;gap:0;margin:14px 0 4px}
.htl .s{flex:1;text-align:center;position:relative;font-size:12px;font-weight:700;color:var(--muted)}
.htl .s::before{content:'';position:absolute;top:12px;left:-50%;right:50%;height:3px;background:var(--surface-3)}
.htl .s:first-child::before{display:none}
.htl .s.done::before{background:var(--brand)}
.htl .s i{width:26px;height:26px;border-radius:50%;background:var(--surface-3);color:#fff;display:grid;place-items:center;margin:0 auto 6px;position:relative;z-index:1;font-style:normal}
.htl .s.done{color:var(--text)}
.htl .s.done i{background:var(--brand)}
.wdocs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.wdoc{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.wdoc .h{display:flex;gap:12px;align-items:center}
.wdoc .h b{display:block;font-size:16px}
.wdoc .h small{font-size:13px;color:var(--muted);font-weight:600}
.wdoc .m{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--muted)}
.wdoc .m span{display:inline-flex;gap:5px;align-items:center}
.wdoc .f{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.wartic{display:grid;grid-template-columns:1fr 300px;gap:36px;padding:20px 0;align-items:start}
.wartic .hero{border-radius:26px;overflow:hidden;line-height:0;aspect-ratio:2/1;margin-bottom:22px}
.wartic .hero svg{width:100%;height:100%}
.wartic h1{font:600 40px/1.08 var(--fd);margin:8px 0 12px}
.wartic .meta{color:var(--muted);font-weight:600;font-size:14px;margin-bottom:20px}
.wartic p{font-size:16.5px;line-height:1.75;margin-bottom:16px;font-weight:500}
/* modal */
#wModal{position:absolute;left:0;right:0;bottom:0;top:46px;z-index:80;pointer-events:none;display:flex;align-items:center;justify-content:center;padding:20px}
#wModal.open{pointer-events:auto}
.wdlg{position:relative;background:var(--bg);border-radius:24px;padding:22px;width:100%;max-width:480px;max-height:100%;overflow-y:auto;box-shadow:0 30px 60px rgba(0,0,0,.25);opacity:0;transform:translateY(16px) scale(.98);transition:opacity .25s,transform .3s;scrollbar-width:none}
.wdlg.wide{max-width:640px}
#wModal.open .wdlg{opacity:1;transform:none}

/* ===== WEB: admin ===== */
.adm{display:grid;grid-template-columns:236px 1fr;height:100%}
.aside{background:var(--ink);color:#B9D6CC;display:flex;flex-direction:column;padding:18px 12px;overflow-y:auto;scrollbar-width:none}
.aside .lg{display:flex;align-items:center;gap:9px;color:#fff;font:600 19px var(--fd);padding:4px 8px 18px}
.aside .lg em{font:800 9.5px var(--fb);font-style:normal;background:#7FE0B9;color:var(--ink);padding:3px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.06em}
.anav{display:flex;flex-direction:column;gap:2px}
.anav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;font-weight:600;font-size:14px;white-space:nowrap}
.anav button:hover{background:rgba(255,255,255,.06);color:#fff}
.anav button.on{background:rgba(127,224,185,.16);color:#fff}
.anav button .c{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:800;border-radius:8px;padding:1px 7px}
.aside .who{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.08)}
.aside .who b{display:block;color:#fff;font-size:13.5px}
.aside .who small{font-size:11.5px;font-weight:600}
.amain{overflow-y:auto;min-width:0;padding:22px 28px 40px}
.atop{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.atop h1{font:600 28px var(--fd)}
.atop small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.atop .acts{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.kpi.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpi small{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi.dark small{color:#9FC6B9}
.kpi b{display:block;font:600 28px/1.1 var(--fd);margin:8px 0 4px}
.kpi .tr{font-size:12px;font-weight:800;color:var(--ok)}
.kpi.dark .tr{color:#7FE0B9}
.kpi .tr.dn{color:var(--bad)}
.agrid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
.apanel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;min-width:0}
.apanel h3{font:600 18px var(--fd);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.apanel h3 small{font:700 12.5px var(--fb);color:var(--brand);cursor:pointer}
.chart{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.chart .bar{width:100%;max-width:26px;border-radius:7px 7px 3px 3px;background:var(--brand-2);transition:height .6s cubic-bezier(.2,.8,.2,1)}
.chart .bar.hi{background:var(--brand)}
.chart small{font-size:10px;font-weight:700;color:var(--muted)}
.tblw{overflow-x:auto;margin:0 -18px;padding:0 18px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.tbl th{text-align:left;font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-weight:600}
.tbl tr:last-child td{border:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tr.fresh td{background:color-mix(in srgb,var(--brand-2) 60%,transparent)}
.tbl .pn{display:flex;align-items:center;gap:10px}
.tbl .pn span{width:40px;height:40px;border-radius:10px;overflow:hidden;line-height:0;flex:none}
.tbl .pn span svg{width:100%;height:100%}
.tbl .pn b{display:block;font-size:13.5px}
.tbl .pn small{font-size:12px;color:var(--muted);font-weight:600}
.stk{display:inline-flex;align-items:center;gap:6px}
.stk button{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center}
.stk b{min-width:30px;text-align:center}
.lowl{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lowl:last-child{border:0}
.lowl span.t{width:38px;height:38px;border-radius:10px;overflow:hidden;line-height:0;flex:none}
.lowl span.t svg{width:100%;height:100%}
.lowl .tx{flex:1;min-width:0}
.lowl b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lowl small{font-size:12px;color:var(--muted);font-weight:600}
.hbar{display:flex;align-items:center;gap:10px;padding:7px 0}
.hbar .lb{width:150px;font-size:13px;font-weight:700;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tk{flex:1;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.hbar .tk i{display:block;height:100%;border-radius:5px;background:var(--brand)}
.hbar .vv{width:72px;text-align:right;font-size:12.5px;font-weight:800;flex:none}
.afil{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.afil .chip{height:34px;font-size:12.5px}
.asearch{display:flex;align-items:center;gap:8px;height:38px;border-radius:11px;background:var(--surface);border:1.5px solid var(--line);padding:0 12px;color:var(--muted);margin-left:auto;min-width:200px}
.asearch input{border:0;outline:none;background:none;font-weight:600;font-size:13.5px;flex:1;min-width:0;color:var(--text)}

/* ===== container queries for responsive web ===== */
@container site (max-width: 980px){
  .wnav{display:none}
  .wnav2{display:flex}
  .whero{grid-template-columns:1fr;gap:26px;padding-top:30px}
  .whero h1{font-size:44px}
  .trust{grid-template-columns:repeat(2,1fr)}
  .wcats{grid-template-columns:repeat(3,1fr)}
  .cband{grid-template-columns:1fr}
  .wshop{grid-template-columns:1fr}
  .wside{flex-direction:row;flex-wrap:wrap;gap:12px}
  .wside .fl{flex-direction:row;flex-wrap:wrap;gap:6px}
  .wside .fl button{border:1.5px solid var(--line);background:var(--surface)}
  .wside>div{flex:1 1 100%}
  .wpd{grid-template-columns:1fr;gap:20px}
  .wcart{grid-template-columns:1fr}
  .sticky{position:static}
  .wacc{grid-template-columns:1fr}
  .wartic{grid-template-columns:1fr}
  .wfoot .cols{grid-template-columns:1fr 1fr}
  .adm{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .aside{flex-direction:row;align-items:center;padding:10px 12px;gap:10px;overflow-x:auto}
  .aside .lg{padding:0 8px 0 4px;flex:none}
  .anav{flex-direction:row}
  .aside .who{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .agrid{grid-template-columns:1fr}
}
@container site (max-width: 600px){
  .wh-in{padding:10px 16px;gap:8px}
  .wsearch{display:none}
  .wlogo{margin-right:auto}
  .wib span.t{display:none}
  .ww{padding:0 16px}
  .whero h1{font-size:36px}
  .whero p{font-size:15.5px}
  .wstats{gap:18px}
  .trust{grid-template-columns:1fr 1fr;gap:8px}
  .trust div{padding:12px;flex-direction:column;align-items:flex-start;gap:8px}
  .wcats{grid-template-columns:repeat(3,1fr);gap:8px}
  .wcat{padding:6px 6px 10px;font-size:12.5px;border-radius:16px}
  .wcat small{display:none}
  .wgrid{grid-template-columns:1fr 1fr;gap:10px}
  .wpc .nm{font-size:13.5px}
  .wpc .pr{flex-wrap:wrap}
  .wsh h2{font-size:24px}
  .cband{padding:22px;border-radius:22px}
  .cband h2{font-size:26px}
  .dmini{grid-template-columns:1fr}
  .wart{grid-template-columns:1fr}
  .wci{grid-template-columns:64px 1fr;gap:12px}
  .wci .pa{width:64px;height:64px}
  .wci>.stepper,.wci>.price{grid-column:2}
  .adr,.payg{grid-template-columns:1fr 1fr}
  .pinfo h1{font-size:28px}
  .wartic h1{font-size:30px}
  .amain{padding:16px 14px 30px}
  .kpis{gap:8px}
  .kpi b{font-size:22px}
  .atop h1{font-size:24px}
  .asearch{margin-left:0;flex:1 1 100%}
  .hbar .lb{width:110px}

function flushInbox() { const n = S.inbox.shift(); if (!n) return; setTimeout(() => banner(n.t, n.s, () => { const o = myOrders()[0]; if (o) { S.oid = o.id; go('order'); } }), 700); }
function tabbar(active) { return `<nav class="tabbar">${[['home', 'home', 'Home'], ['shop', 'search', 'Shop'], ['health', 'pulse', 'Health'], ['account', 'user', 'Account']].map(([id, i, l]) => `<button class="${id === active ? 'on' : ''}" onclick="tab('${id}')"><span class="ti">${ic(i, 20)}</span>${l}</button>`).join('')}</nav>`; }
const cartBtn = () => `<button class="ib" onclick="go('cart')" aria-label="Cart">${ic('bag')}${cartCount() ? `<span class="bd">${cartCount()}</span>` : ''}</button>`;
const pcard = p => `<div class="pc"><button class="pa" data-prod="${p.id}">${pArt(p)}${discPct(p) >= 10 ? `<span class="dtag">${discPct(p)}% OFF</span>` : ''}${p.stock === 0 ? '<span class="oos">Out of stock</span>' : ''}</button><button class="nm" data-prod="${p.id}" style="text-align:left">${esc(p.name)}</button>${rating(p)}<div class="pr"><span><span class="price">${money(p.price)}</span><span class="mrp">${money(p.mrp)}</span></span>${qtyCtl(p)}</div></div>`;
function payProcess(sh, label, done) {
  sh.innerHTML = `<div class="grab"></div><div class="payproc"><span class="spinner dk"></span><b>Processing payment</b><small>${label} · via secure payment gateway</small><p class="muted" style="font-size:12px;font-weight:600;margin-top:16px">${ic('lock', 12)} 256-bit encrypted · PCI-DSS compliant</p></div>`;

}

      el.querySelector('#np').onclick = () => wModal(`${wHead('New article')}<label class="field"><span>Title</span><input id="at" placeholder="e.g. 5 foods rich in iron"></label><label class="field"><span>Category</span><select class="inp" id="ac">${['Nutrition', 'Sleep', 'Fitness', 'Heart health', 'Skin'].map(x => `<option>${x}</option>`).join('')}</select></label><label class="field"><span>Body</span><textarea placeholder="Write or paste the article…"></textarea></label><div class="adr"><button class="btn btn-ghost" id="ad">Save draft</button><button class="btn btn-dark" id="ap">Publish</button></div>`, d => { const save = pub => { const t = d.querySelector('#at').value.trim(); if (!t) { toast('Add a title'); return; } S.posts.unshift({ id: 'p' + Date.now(), title: t, cat: d.querySelector('#ac').value, mins: 4, hue: hueOf(t), pub, views: pub ? 1 : 0, rel: ['vitd', 'omega'], ex: 'Fresh from the Wellnest editorial team.' }); wClose(); toast(pub ? 'Published to web & app' : 'Draft saved'); wrender(false); }; d.querySelector('#ad').onclick = () => save(false); d.querySelector('#ap').onclick = () => save(true); });
      el.querySelector('#nc').onclick = () => wModal(`${wHead('Create coupon')}<label class="field"><span>Code</span><input id="cc" placeholder="e.g. WINTER25" style="text-transform:uppercase"></label><div class="adr"><label class="field"><span>Discount (%)</span><input id="cv" inputmode="numeric" value="25"></label><label class="field"><span>Min. order (${CUR})</span><input id="cm" inputmode="numeric" value="999"></label></div><button class="btn btn-dark" id="cs">Create coupon</button>`, d => d.querySelector('#cs').onclick = () => { const k = d.querySelector('#cc').value.trim().toUpperCase().replace(/\W/g, ''); if (!k) { toast('Add a code'); return; } const v = +d.querySelector('#cv').value || 10, m = +d.querySelector('#cm').value || 0; S.coupons[k] = { type: 'pct', v, min: m, active: true, desc: `${v}% off${m ? ' orders above ' + money(m) : ''}`, used: 0 }; wClose(); toast(`${k} is live on web & app`); wrender(false); });
    }
  },
  reports: {
    html: () => { const cats = CATS.map(c => [c.short, PRODUCTS.filter(p => p.cat === c.id).reduce((s, p) => s + p.sold * p.price, 0)]).sort((a, b) => b[1] - a[1]), cm = cats[0][1]; const top = [...PRODUCTS].sort((a, b) => b.sold * b.price - a.sold * a.price).slice(0, 6); const fmtL = v => CUR + (v / 1e5).toFixed(1) + 'L'; return `<div class="atop"><div><small>Last 30 days</small><h1>Reports</h1></div><div class="acts"><button class="btn btn-line sm" onclick="toast('PDF report generated')">${ic('file', 15)} PDF</button><button class="btn btn-dark sm" onclick="toast('CSV exported')">${ic('download', 15)} CSV</button></div></div>
      <div class="kpis"><div class="kpi dark"><small>Gross revenue</small><b>${CUR}14.8L</b><span class="tr">▲ 12.4%</span></div><div class="kpi"><small>Orders</small><b>3,912</b><span class="tr">▲ 8.1%</span></div><div class="kpi"><small>Consultation revenue</small><b>${CUR}2.9L</b><span class="tr">▲ 21.6%</span></div><div class="kpi"><small>Return rate</small><b>1.8%</b><span class="tr dn">▲ 0.2%</span></div></div>
      <div class="agrid"><div class="apanel"><h3>Revenue by category</h3>${cats.map(([n, v]) => `<div class="hbar"><span class="lb">${n}</span><span class="tk"><i style="width:${v / cm * 100}%"></i></span><span class="vv">${fmtL(v)}</span></div>`).join('')}</div><div class="apanel"><h3>Payment methods</h3>${[['UPI', 58], ['Cards', 24], ['Cash on delivery', 11], ['Net banking', 7]].map(([n, v]) => `<div class="hbar"><span class="lb">${n}</span><span class="tk"><i style="width:${v / .58}%;background:var(--accent)"></i></span><span class="vv">${v}%</span></div>`).join('')}</div></div>
      <div class="apanel"><h3>Top products</h3><div class="tblw"><table class="tbl"><thead><tr><th>Product</th><th>Units sold</th><th>Revenue</th><th>Rating</th><th>Stock</th></tr></thead><tbody>${top.map(p => `<tr style="cursor:default"><td><div class="pn"><span>${pArt(p)}</span><div><b>${esc(p.name)}</b><small>${esc(p.brand)}</small></div></div></td><td>${p.sold.toLocaleString('en-IN')}</td><td><b>${fmtL(p.sold * p.price)}</b></td><td>★ ${p.rating}</td><td>${statusPill(stockState(p))}</td></tr>`).join('')}</tbody></table></div></div>`; }
  }
};

/* ---------- web delegation ---------- */
$('#wsite').addEventListener('click', e => {
  if (cartClick(e)) return;
  const ap = e.target.closest('[data-ap]'); if (ap) { ago(ap.dataset.ap); return; }
  const n = e.target.closest('[data-w]'); if (!n) return;
  const page = n.dataset.w, p = {};
  if (n.dataset.id) p.id = n.dataset.id;
  if (n.dataset.cat !== undefined) p.cat = n.dataset.cat;
  if (n.dataset.tab) p.tab = n.dataset.tab;
  if (page === 'shop' && !n.dataset.cat) p.cat = null;
  wgo(page, p);
});
$('#wsite').addEventListener('keydown', e => { if (e.target.id === 'wq' && e.key === 'Enter') { S.wsel.cat = null; wgo('shop', { q: e.target.value.trim(), cat: null }); } });

/* ---------- shell: view toggle, toolbar, pitch ---------- */
function setView(v, quiet) {
  S.view = v; document.body.classList.toggle('web', v === 'web');
  $$('#vt button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  try { history.replaceState(null, '', v === 'web' ? (W.mode === 'admin' ? '#web-admin' : '#web') : '#app'); } catch (e) { }
  if (v === 'web') { drawWTool(); wrender(false); } else { fitPhone(); if (current) refresh(); flushInbox(); }
  if (!quiet) window.scrollTo(0, 0);
}
function drawWTool() {
  $('#wmode').innerHTML = [['store', 'store', 'Store'], ['admin', 'grid', 'Admin dashboard']].map(([k, i, l]) => `<button class="${W.mode === k ? 'on' : ''}" data-m="${k}">${ic(i, 15)} ${l}</button>`).join('');
  $('#wdev').innerHTML = [['desktop', 'monitor', 'Desktop'], ['tablet', 'tablet', 'Tablet'], ['mobile', 'mobile', 'Mobile']].map(([k, i, l]) => `<button class="${W.dev === k ? 'on' : ''}" data-d="${k}">${ic(i, 15)} ${l}</button>`).join('');
  $('#bframe').dataset.w = W.dev;
}
$('#wmode').onclick = e => { const b = e.target.closest('[data-m]'); if (!b || b.dataset.m === W.mode) return; W.hist.push([W.mode, W.page, W.p, W.apage]); W.mode = b.dataset.m; drawWTool(); wrender(true); try { history.replaceState(null, '', W.mode === 'admin' ? '#web-admin' : '#web'); } catch (er) { } };
$('#wdev').onclick = e => { const b = e.target.closest('[data-d]'); if (!b) return; W.dev = b.dataset.d; drawWTool(); };
$('#bback').innerHTML = ic('chevL', 17, 2.4); $('#brf').innerHTML = ic('refresh', 15, 2.4);
$('#bback').onclick = wback; $('#brf').onclick = () => wrender(false);
$('#gbrand').innerHTML = `${logo(32)}<span>${APP}</span><em>Concept</em>`;
$('#vt').innerHTML = `<button data-v="app">${ic('mobile', 17)} App view</button><button data-v="web">${ic('monitor', 17)} Web view</button>`;
$('#vt').onclick = e => { const b = e.target.closest('[data-v]'); if (b) setView(b.dataset.v); };
const JUMPS = [['login', 'Sign in (OTP)'], ['home', 'Home'], ['shop', 'Catalog & filters'], ['product', 'Product'], ['cart', 'Cart & coupons'], ['checkout', 'Checkout & payment'], ['order', 'Order tracking'], ['health', 'Health & reminders'], ['hprofile', 'Health profile'], ['doctors', 'Book a doctor'], ['article', 'Health article'], ['privacy', 'Privacy & data']];
function appJump(n) {
  closeSheet(true);
  if (n === 'product') { S.pid = 'vitd'; go('product', { reset: true, stack: ['shop'] }); return; }
  if (n === 'cart' || n === 'checkout') { if (!S.cart.length) S.cart = [{ id: 'vitd', qty: 1 }, { id: 'tulsi', qty: 2 }]; go(n, { reset: true, stack: n === 'checkout' ? ['home', 'cart'] : ['home'] }); return; }
  if (n === 'order') { S.oid = myOrders()[0].id; go('order', { reset: true, stack: ['account', 'orders'] }); return; }
  if (n === 'doctors' || n === 'hprofile' || n === 'privacy') { go(n, { reset: true, stack: [n === 'privacy' ? 'account' : 'health'] }); return; }
  if (n === 'article') { S.aid = 'p1'; go('article', { reset: true, stack: ['home'] }); return; }
  go(n, { reset: true });
}
function markJump() { const m = { success: 'checkout', orders: 'order', bookdoc: 'doctors', apptok: 'doctors', notifs: 'home' }; $$('#jump button').forEach(b => b.classList.toggle('on', b.dataset.j === (m[current] || current))); }
function buildPitch() {
  $('#pitch').innerHTML = `<h1>Health & wellness store: app, website & admin</h1>
    <p>A clickable concept of the full platform. The mobile app, the responsive website and the admin dashboard all share one backend. Switch to <b>Web view</b> at the top to see the website and the admin dashboard.</p>
    <ul class="feats">${[['bag', 'Catalog, filters, cart, coupons, checkout'], ['card', 'UPI, card, net banking & COD payments'], ['truck', 'Order tracking with live status updates'], ['steth', 'Doctor booking, health profile, reminders'], ['shield', 'Consents, encryption & data controls']].map(([i, t]) => `<li><span>${ic(i, 15, 2.2)}</span>${t}</li>`).join('')}</ul>
    <div class="jump-title">Jump to a screen</div>
    <div class="jump" id="jump">${JUMPS.map(([k, l]) => `<button data-j="${k}">${l}</button>`).join('')}</div>
    <div class="hint-small">Try this: place an order here, then open <b>Web view → Admin dashboard</b>. The order shows up as new, and when you mark it Shipped, the app sends a notification.</div>`;
  $('#jump').onclick = e => { const b = e.target.closest('[data-j]'); if (b) appJump(b.dataset.j); };
}
function fitPhone() { const s = window.innerWidth <= 520 ? 1 : Math.min(1, (window.innerHeight - parseInt(getComputedStyle(document.documentElement).getPropertyValue('--gh')) - 32) / 844); document.documentElement.style.setProperty('--s', s.toFixed(4)); }
function tick() { $('#sbTime').textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M/, ''); }

/* ---------- boot ---------- */
buildPitch(); fitPhone(); tick(); setInterval(tick, 15000);
window.addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(fitPhone, 120); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { wClose(); closeSheet(); } });
go('login');
function fromHash() { const h = (location.hash || '').toLowerCase(); if (h.startsWith('#web')) { W.mode = h === '#web-admin' ? 'admin' : 'store'; setView('web', true); } else setView('app', true); }
fromHash();
window.addEventListener('hashchange', fromHash);
</script>
</body>
